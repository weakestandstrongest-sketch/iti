<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとつ アイコン案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  /* 4案を同じ枠で並べ、大・ホーム画面・タブの3サイズで見比べる */
  :root {
    --bg: #eef0f2;
    --fg: #15171c;
    --muted: #6c7180;
    --line: #d5d9e0;
    --surface: #f7f8fa;
    --accent: #3346a8;
    --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --fg: #e9eaee; --muted: #8a8f9c; --line: #2a2e38; --surface: #161920; --accent: #8fa0ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --fg: #e9eaee; --muted: #8a8f9c; --line: #2a2e38; --surface: #161920; --accent: #8fa0ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--ui);
    line-height: 1.7;
    padding-block: 48px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 40px; }
  header { display: grid; gap: 8px; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6vw, 40px); letter-spacing: 0.04em; text-wrap: balance; }
  header p { color: var(--muted); font-size: 14px; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 24px;
    display: grid;
    gap: 16px;
    align-content: start;
  }
  .card svg { display: block; }
  .big { width: 100%; max-width: 180px; height: auto; aspect-ratio: 1; margin: 0 auto; }
  .sizes { display: flex; align-items: flex-end; gap: 14px; }
  .sizes svg:nth-child(1) { width: 60px; height: 60px; }
  .sizes svg:nth-child(2) { width: 32px; height: 32px; }
  .sizes svg:nth-child(3) { width: 16px; height: 16px; }
  .tag { font-size: 12px; letter-spacing: 0.2em; color: var(--accent); }
  h2 { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.06em; }
  .card p { font-size: 14px; color: var(--muted); }
  .now { font-size: 12px; color: var(--accent); border: 1px solid var(--accent); padding: 2px 8px; justify-self: start; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ひとつ アイコン案</h1>
    <p>ホーム画面とブラウザのタブに出るアイコンの案です。どれも「1つだけ」を形にしています。いまのアプリには仮でA案を入れています。</p>
  </header>

  <div class="grid">
    <section class="card">
      <svg class="big" viewBox="0 0 512 512" aria-label="A案"><use href="#a"/></svg>
      <div class="sizes"><svg viewBox="0 0 512 512"><use href="#a"/></svg><svg viewBox="0 0 512 512"><use href="#a"/></svg><svg viewBox="0 0 512 512"><use href="#a"/></svg></div>
      <span class="tag">A</span>
      <h2>一筆</h2>
      <p>漢字の「一」を、筆の入りと止めを残した一画で。藍の地に白。アプリの中の明朝の文字とつながります。</p>
      <span class="now">いま使用中</span>
    </section>

    <section class="card">
      <svg class="big" viewBox="0 0 512 512" aria-label="B案"><use href="#b"/></svg>
      <div class="sizes"><svg viewBox="0 0 512 512"><use href="#b"/></svg><svg viewBox="0 0 512 512"><use href="#b"/></svg><svg viewBox="0 0 512 512"><use href="#b"/></svg></div>
      <span class="tag">B</span>
      <h2>一点</h2>
      <p>黒い地に、光る点がひとつ。いちばん言葉の少ない案で、小さいサイズでもつぶれません。</p>
    </section>

    <section class="card">
      <svg class="big" viewBox="0 0 512 512" aria-label="C案"><use href="#c"/></svg>
      <div class="sizes"><svg viewBox="0 0 512 512"><use href="#c"/></svg><svg viewBox="0 0 512 512"><use href="#c"/></svg><svg viewBox="0 0 512 512"><use href="#c"/></svg></div>
      <span class="tag">C</span>
      <h2>的</h2>
      <p>輪の真ん中に点。「今日はここだけを狙う」という集中の印です。明るい地なので、ホーム画面で目立ちます。</p>
    </section>

    <section class="card">
      <svg class="big" viewBox="0 0 512 512" aria-label="D案"><use href="#d"/></svg>
      <div class="sizes"><svg viewBox="0 0 512 512"><use href="#d"/></svg><svg viewBox="0 0 512 512"><use href="#d"/></svg><svg viewBox="0 0 512 512"><use href="#d"/></svg></div>
      <span class="tag">D</span>
      <h2>一枚</h2>
      <p>少し傾いた紙に、一行だけ書いてある。メモを1枚だけ机に置いておく感じです。</p>
    </section>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="a" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#1b2350"/>
      <path fill="#f1f2f5" d="M114 220 H338 L380 186 L424 244 L404 292 H100 Q86 292 90 278 Z"/>
    </symbol>
    <symbol id="b" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#15171c"/>
      <circle cx="256" cy="256" r="120" fill="#8fa0ff" opacity="0.14"/>
      <circle cx="256" cy="256" r="64" fill="#8fa0ff"/>
    </symbol>
    <symbol id="c" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#eef0f2"/>
      <circle cx="256" cy="256" r="150" fill="none" stroke="#15171c" stroke-width="28"/>
      <circle cx="256" cy="256" r="46" fill="#3346a8"/>
    </symbol>
    <symbol id="d" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#3346a8"/>
      <g transform="rotate(-6 256 256)">
        <rect x="136" y="112" width="240" height="288" rx="10" fill="#f4f5f8"/>
        <rect x="176" y="244" width="160" height="22" rx="4" fill="#15171c"/>
      </g>
    </symbol>
  </defs>
</svg>
</body>
</html>
