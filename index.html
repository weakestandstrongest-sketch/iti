<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとつ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="今日やることを1つだけ決めるアプリ">
<meta name="apple-mobile-web-app-title" content="ひとつ">
<meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  /* 一枚の紙に一行だけ。明朝の大きな一行と、藍の一筆だけで構成する */
  :root {
    --bg: #eef0f2;
    --fg: #15171c;
    --muted: #7d828e;
    --line: #cfd3da;
    --accent: #3346a8;
    --on-accent: #f4f5f8;
    --halo: rgba(51, 70, 168, 0.14);
    --intro-bg: #0b0c10;
    --intro-fg: #e9eaee;
    --intro-glow: #8fa0ff;
    --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115;
      --fg: #e9eaee;
      --muted: #6c7180;
      --line: #2a2e38;
      --accent: #8fa0ff;
      --on-accent: #0f1115;
      --halo: rgba(143, 160, 255, 0.16);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --fg: #e9eaee;
    --muted: #6c7180;
    --line: #2a2e38;
    --accent: #8fa0ff;
    --on-accent: #0f1115;
    --halo: rgba(143, 160, 255, 0.16);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--ui);
    display: grid;
    place-items: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }

  [hidden] { display: none !important; }

  /* 左上のしるし */
  .mark {
    position: fixed;
    top: calc(28px + env(safe-area-inset-top, 0px));
    left: calc(28px + env(safe-area-inset-left, 0px));
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 6px var(--halo), 0 0 18px 2px var(--halo);
  }
  .intro .mark { opacity: 0; }

  /* 起動アニメーション：暗転の中に光の点がひとつ灯り、左上のしるしへ収まる */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--intro-bg);
    overflow: hidden;
    cursor: pointer;
  }
  #intro .orb, #intro .halo, #intro .ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
  }
  #intro .orb {
    width: 72px;
    height: 72px;
    margin: -36px 0 0 -36px;
    background: var(--intro-glow);
    box-shadow: 0 0 36px 6px rgba(143, 160, 255, 0.5), 0 0 120px 40px rgba(143, 160, 255, 0.16);
  }
  #intro .halo {
    width: 320px;
    height: 320px;
    margin: -160px 0 0 -160px;
    background: radial-gradient(circle, rgba(143, 160, 255, 0.22) 0%, rgba(143, 160, 255, 0.06) 40%, transparent 70%);
  }
  #intro .ripple {
    width: 72px;
    height: 72px;
    margin: -36px 0 0 -36px;
    border: 1px solid rgba(143, 160, 255, 0.7);
  }
  #intro .word {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(50% + 84px);
    text-align: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.28em;
    padding-left: 0.28em;
    color: var(--intro-fg);
  }

  main {
    width: 100%;
    max-width: 680px;
    text-align: center;
  }

  /* 入力画面 */
  form { display: grid; gap: 28px; }

  label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.32em;
    color: var(--muted);
  }

  input {
    width: 100%;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(24px, 6.4vw, 36px);
    text-align: center;
    color: var(--fg);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 14px 4px;
    outline: none;
    transition: border-color 0.3s;
  }
  input:focus { border-bottom-color: var(--accent); }
  input::placeholder { color: var(--line); }

  /* 表示画面 */
  #task {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(32px, 9vw, 64px);
    line-height: 1.45;
    letter-spacing: 0.04em;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  #task span {
    background: linear-gradient(var(--accent), var(--accent)) no-repeat 0 58% / 0% 0.08em;
    transition: background-size 0.7s cubic-bezier(0.6, 0, 0.2, 1), color 0.7s;
  }
  .done #task span {
    background-size: 100% 0.08em;
    color: var(--muted);
  }

  #message {
    margin-top: 28px;
    font-size: 13px;
    letter-spacing: 0.24em;
    color: var(--accent);
    min-height: 1.5em;
  }

  .actions {
    margin-top: 48px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 28px;
  }

  button {
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 4px;
    cursor: pointer;
    transition: color 0.2s, background-color 0.2s, border-color 0.2s;
  }
  button:hover { color: var(--fg); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

  #doneBtn {
    color: var(--fg);
    border: 1px solid var(--fg);
    border-radius: 2px;
    padding: 12px 36px;
  }
  #doneBtn:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .done #doneBtn { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body class="intro">
<span class="mark" aria-hidden="true"></span>

<div id="intro" aria-hidden="true">
  <div class="halo"></div>
  <div class="ripple"></div>
  <div class="orb"></div>
  <div class="word">ひとつ</div>
</div>

<main>
  <form id="form" hidden>
    <label for="input">今日やることを、1つだけ。</label>
    <input id="input" type="text" maxlength="80" autocomplete="off" required>
  </form>

  <section id="view" hidden>
    <h1 id="task"><span></span></h1>
    <p id="message"></p>
    <div class="actions">
      <button id="doneBtn" type="button">やった</button>
      <button id="editBtn" type="button">書き直す</button>
    </div>
  </section>
</main>

<script>
  const KEY = "hitotsu";
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const view = document.getElementById("view");
  const task = document.querySelector("#task span");
  const message = document.getElementById("message");

  // 日付が変わったらリセットするため、ローカル日付をキーにする
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      if (data && data.date === today()) return data;
    } catch (e) {}
    return null;
  }

  function save(data) {
    try {
      if (data) localStorage.setItem(KEY, JSON.stringify(data));
      else localStorage.removeItem(KEY);
    } catch (e) {}
  }

  let state = load();

  function render() {
    if (!state) {
      view.hidden = true;
      form.hidden = false;
      input.value = "";
      if (!document.body.classList.contains("intro")) input.focus();
      return;
    }
    form.hidden = true;
    view.hidden = false;
    task.textContent = state.text;
    view.classList.toggle("done", state.done);
    message.textContent = state.done ? "今日はもう十分。" : "";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    state = { date: today(), text, done: false };
    save(state);
    render();
  });

  document.getElementById("doneBtn").addEventListener("click", () => {
    state.done = true;
    save(state);
    render();
  });

  document.getElementById("editBtn").addEventListener("click", () => {
    const prev = state.text;
    state = null;
    save(null);
    render();
    input.value = prev;
    input.select();
  });

  // タブを開きっぱなしで日付をまたいだ場合に備える
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && state && state.date !== today()) {
      state = null;
      save(null);
      render();
    }
  });

  render();
  playIntro();

  // 起動アニメーション。タップかキー入力で最後まで飛ばせる
  function playIntro() {
    const intro = document.getElementById("intro");
    const mark = document.querySelector(".mark");
    const finish = () => {
      intro.remove();
      document.body.classList.remove("intro");
      if (!form.hidden) input.focus();
    };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || !intro.animate) {
      finish();
      return;
    }

    const $ = (s) => intro.querySelector(s);
    const ease = "cubic-bezier(0.2, 0.8, 0.2, 1)";
    const swift = "cubic-bezier(0.7, 0, 0.2, 1)";
    const anims = [];
    const play = (el, frames, opts) => {
      const a = el.animate(frames, { fill: "both", easing: ease, ...opts });
      anims.push(a);
      return a;
    };

    // 光の点が灯る
    play($(".orb"), [
      { transform: "scale(0.15)", opacity: 0, filter: "blur(14px)" },
      { transform: "scale(1.12)", opacity: 1, filter: "blur(0)", offset: 0.6 },
      { transform: "scale(1)", opacity: 1, filter: "blur(0)" },
    ], { delay: 250, duration: 1100 });
    play($(".halo"), [
      { transform: "scale(0.4)", opacity: 0 },
      { transform: "scale(1)", opacity: 1 },
    ], { delay: 250, duration: 1500 });
    play($(".ripple"), [
      { transform: "scale(1)", opacity: 0.8 },
      { transform: "scale(6)", opacity: 0 },
    ], { delay: 800, duration: 1600, easing: "cubic-bezier(0.1, 0.6, 0.3, 1)" });

    // 名前がにじみから浮かび上がる
    play($(".word"), [
      { opacity: 0, filter: "blur(10px)", letterSpacing: "0.7em", paddingLeft: "0.7em" },
      { opacity: 1, filter: "blur(0)", letterSpacing: "0.28em", paddingLeft: "0.28em" },
    ], { delay: 1100, duration: 1100 });

    // 暗転が明けて、点が左上のしるしへ収まる
    const out = 2600;
    play($(".word"), [{ opacity: 1 }, { opacity: 0, filter: "blur(6px)" }],
      { delay: out, duration: 400, fill: "forwards" });
    play($(".halo"), [{ opacity: 1 }, { opacity: 0 }], { delay: out, duration: 500, fill: "forwards" });
    play(intro, [{ backgroundColor: getComputedStyle(intro).backgroundColor }, { backgroundColor: "transparent" }],
      { delay: out + 100, duration: 800, easing: swift });

    const orbRect = $(".orb").getBoundingClientRect();
    const markRect = mark.getBoundingClientRect();
    const dx = markRect.left + markRect.width / 2 - (orbRect.left + orbRect.width / 2);
    const dy = markRect.top + markRect.height / 2 - (orbRect.top + orbRect.height / 2);
    const fly = play($(".orb"), [
      { transform: "translate(0, 0) scale(1)", backgroundColor: getComputedStyle($(".orb")).backgroundColor },
      { transform: `translate(${dx}px, ${dy}px) scale(${markRect.width / orbRect.width})`, backgroundColor: getComputedStyle(mark).backgroundColor },
    ], { delay: out + 100, duration: 1000, easing: swift, fill: "forwards" });

    // 中身がふわりと立ち上がる
    const section = form.hidden ? view : form;
    [...section.children].forEach((el, i) => {
      play(el, [
        { opacity: 0, transform: "translateY(18px)", filter: "blur(8px)" },
        { opacity: 1, transform: "none", filter: "blur(0)" },
      ], { delay: out + 700 + i * 110, duration: 900 });
    });

    const skip = () => anims.forEach((a) => a.finish());
    intro.addEventListener("pointerdown", skip);
    addEventListener("keydown", skip);

    fly.finished.then(() => {
      removeEventListener("keydown", skip);
      finish();
      // 中身の表示が終わったらアニメーションの指定を外し、元のスタイルに戻す
      Promise.all(anims.map((a) => a.finished)).then(() => anims.forEach((a) => a.cancel()));
    });
  }
</script>
</body>
</html>
