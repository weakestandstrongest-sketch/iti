<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひとつ</title>
<meta name="description" content="今日やることを1つだけ決めるアプリ">
<style>
  :root {
    --bg: #f7f5f0;
    --fg: #1f1d1a;
    --muted: #9a958c;
    --line: #d9d4ca;
    --accent: #1f1d1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --fg: #ece8e0;
      --muted: #6f6b64;
      --line: #34322e;
      --accent: #ece8e0;
    }
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }

  [hidden] { display: none !important; }

  /* 入力画面 */
  form { display: grid; gap: 24px; }

  label {
    font-size: 14px;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  input {
    width: 100%;
    font: inherit;
    font-size: clamp(22px, 6vw, 32px);
    text-align: center;
    color: var(--fg);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 12px 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--fg); }
  input::placeholder { color: var(--line); }

  /* 表示画面 */
  #task {
    font-size: clamp(28px, 8vw, 52px);
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: anywhere;
    transition: color 0.4s, opacity 0.4s;
  }
  .done #task {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
  }

  .actions {
    margin-top: 56px;
    display: flex;
    justify-content: center;
    gap: 24px;
  }

  button {
    font: inherit;
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 4px;
    cursor: pointer;
    transition: color 0.2s;
  }
  button:hover, button:focus-visible { color: var(--fg); }
  button:focus-visible { outline: 1px solid var(--line); outline-offset: 4px; }

  #doneBtn {
    color: var(--fg);
    border: 1px solid var(--fg);
    border-radius: 999px;
    padding: 10px 28px;
  }
  #doneBtn:hover { background: var(--fg); color: var(--bg); }
  .done #doneBtn { display: none; }

  #message {
    margin-top: 24px;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.1em;
    min-height: 1.5em;
  }
</style>
</head>
<body>
<main>
  <form id="form" hidden>
    <label for="input">今日やることを、1つだけ。</label>
    <input id="input" type="text" maxlength="80" autocomplete="off" required>
  </form>

  <section id="view" hidden>
    <h1 id="task"></h1>
    <p id="message"></p>
    <div class="actions">
      <button id="doneBtn" type="button">やった</button>
      <button id="editBtn" type="button">書き直す</button>
    </div>
  </section>
</main>

<script>
  const KEY = "hitotsu";
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const view = document.getElementById("view");
  const task = document.getElementById("task");
  const message = document.getElementById("message");

  // 日付が変わったらリセットするため、ローカル日付をキーにする
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      if (data && data.date === today()) return data;
    } catch (e) {}
    return null;
  }

  function save(data) {
    try {
      if (data) localStorage.setItem(KEY, JSON.stringify(data));
      else localStorage.removeItem(KEY);
    } catch (e) {}
  }

  let state = load();

  function render() {
    if (!state) {
      view.hidden = true;
      form.hidden = false;
      input.value = "";
      input.focus();
      return;
    }
    form.hidden = true;
    view.hidden = false;
    task.textContent = state.text;
    view.classList.toggle("done", state.done);
    message.textContent = state.done ? "今日はもう十分。" : "";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    state = { date: today(), text, done: false };
    save(state);
    render();
  });

  document.getElementById("doneBtn").addEventListener("click", () => {
    state.done = true;
    save(state);
    render();
  });

  document.getElementById("editBtn").addEventListener("click", () => {
    const prev = state.text;
    state = null;
    save(null);
    render();
    input.value = prev;
    input.select();
  });

  // タブを開きっぱなしで日付をまたいだ場合に備える
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && state && state.date !== today()) {
      state = null;
      save(null);
      render();
    }
  });

  render();
</script>
</body>
</html>
