<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>one</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="今日やることを1つだけ決めるアプリ">
<meta name="apple-mobile-web-app-title" content="one">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=DM+Serif+Display:ital@1&family=Instrument+Serif&family=Noto+Sans+JP:wght@400;600;700&family=Space+Mono:wght@700&display=swap">
<style>
  /* 中央の一列。光の点、見出し、ひとつの操作だけを縦に積む */
  :root {
    --bg: #f5f5f7;
    --fg: #1d1d1f;
    --muted: #86868b;
    --line: #d2d2d7;
    --field: #ffffff;
    --accent: #4f5bd5;
    --on-accent: #ffffff;
    --halo: rgba(79, 91, 213, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 28px rgba(0, 0, 0, 0.06);
    --gap: 32px;
    --intro-bg: #000000;
    --intro-fg: #f5f5f7;
    --intro-glow: #8fa0ff;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --fg: #f5f5f7;
      --muted: #86868b;
      --line: #38383a;
      --field: #1c1c1e;
      --accent: #8fa0ff;
      --on-accent: #000000;
      --halo: rgba(143, 160, 255, 0.2);
      --shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --fg: #f5f5f7;
    --muted: #86868b;
    --line: #38383a;
    --field: #1c1c1e;
    --accent: #8fa0ff;
    --on-accent: #000000;
    --halo: rgba(143, 160, 255, 0.2);
    --shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--ui);
    display: grid;
    place-items: center;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  [hidden] { display: none !important; }

  main {
    width: 100%;
    max-width: 640px;
    display: grid;
    justify-items: center;
    gap: var(--gap);
    text-align: center;
  }

  /* 光の点。起動時の点がここへ収まる。輪まで含めた大きさを箱にして、上下の間隔をそろえる */
  .mark {
    position: relative;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--halo);
    box-shadow: 0 0 22px 4px var(--halo);
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .intro .mark { opacity: 0; }

  section { width: 100%; display: grid; justify-items: center; }

  .eyebrow {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  /* 入力画面 */
  #form { width: 100%; display: grid; justify-items: center; gap: var(--gap); }

  #form label {
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    text-wrap: balance;
  }

  .field {
    position: relative;
    width: 100%;
    max-width: 520px;
  }

  input {
    width: 100%;
    height: 64px;
    font: inherit;
    font-size: 20px;
    font-weight: 400;
    color: var(--fg);
    background: var(--field);
    border: 1px solid transparent;
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 0 64px 0 22px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--halo); }
  input::placeholder { color: var(--muted); }

  #submitBtn {
    position: absolute;
    top: 50%;
    right: 12px;
    width: 40px;
    height: 40px;
    margin-top: -20px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    display: grid;
    place-items: center;
    padding: 0;
    opacity: 0;
    transform: scale(0.6);
    pointer-events: none;
    transition: opacity 0.25s, transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
  }
  .has-text #submitBtn { opacity: 1; transform: scale(1); pointer-events: auto; }
  #submitBtn svg { width: 18px; height: 18px; }

  /* 表示画面 */
  #view { gap: 16px; }

  #task {
    font-size: clamp(36px, 10vw, 68px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  #task span {
    background: linear-gradient(var(--accent), var(--accent)) no-repeat 0 55% / 0% 0.07em;
    transition: background-size 0.8s cubic-bezier(0.65, 0, 0.35, 1), color 0.8s;
  }
  .done #task span {
    background-size: 100% 0.07em;
    color: var(--muted);
  }

  .actions {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px 24px;
  }

  button {
    font: inherit;
    font-size: 17px;
    font-weight: 400;
    color: var(--accent);
    background: none;
    border: none;
    padding: 10px 4px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s, background-color 0.2s;
  }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 999px; }
  #editBtn:hover { opacity: 0.7; }

  #doneBtn {
    min-width: 160px;
    height: 50px;
    padding: 0 32px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  #doneBtn:hover { opacity: 0.88; }
  .done #doneBtn { display: none; }

  /* 完了の印 */
  #message {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    min-height: 28px;
  }
  #message svg { width: 28px; height: 28px; }
  #message circle { stroke-dasharray: 76; stroke-dashoffset: 76; transition: stroke-dashoffset 0.6s 0.4s cubic-bezier(0.65, 0, 0.35, 1); }
  #message path { stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 0.35s 0.9s ease-out; }
  #message span { opacity: 0; transform: translateX(-6px); transition: opacity 0.4s 1s, transform 0.4s 1s; }
  .done #message circle, .done #message path { stroke-dashoffset: 0; }
  .done #message span { opacity: 1; transform: none; }
  #view:not(.done) #message { visibility: hidden; position: absolute; }

  /* 起動アニメーション：暗転の中に光の点がひとつ灯り、見出しの上へ収まる */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--intro-bg);
    overflow: hidden;
    cursor: pointer;
  }
  #intro .orb, #intro .halo, #intro .ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
  }
  #intro .orb {
    width: 72px;
    height: 72px;
    margin: -36px 0 0 -36px;
    background: var(--intro-glow);
    box-shadow: 0 0 36px 6px rgba(143, 160, 255, 0.5), 0 0 110px 30px rgba(143, 160, 255, 0.16);
  }
  #intro .halo {
    width: 320px;
    height: 320px;
    margin: -160px 0 0 -160px;
    background: radial-gradient(circle, rgba(143, 160, 255, 0.22) 0%, rgba(143, 160, 255, 0.06) 40%, transparent 70%);
  }
  #intro .ripple {
    width: 72px;
    height: 72px;
    margin: -36px 0 0 -36px;
    border: 1px solid rgba(143, 160, 255, 0.7);
  }
  #intro .word {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(50% + 56px);
    text-align: center;
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--intro-fg);
  }

  /* マッチカット：画面の中心に「one」を固定し、周りの紙面だけを拍に合わせて差し替える */
  #intro .stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    transform-origin: 50% 50%;
  }
  #intro .cut { position: absolute; inset: 0; visibility: hidden; }
  #intro .cut.on { visibility: visible; }
  #intro .page {
    position: absolute;
    left: 0;
    top: 0;
    white-space: nowrap;
    line-height: 1.12;
  }
  #intro .page p { opacity: 0.38; }
  #intro .page p.hit-line { opacity: 1; }
  #intro .page p.hit-line .rest { opacity: 0.38; }
  #intro .hit { display: inline-block; padding: 0 0.08em; }
  #intro .hl-marker .hit { background: var(--mark, #8fa0ff); color: #000; }
  #intro .hl-invert .hit { background: currentColor; }
  #intro .hl-invert .hit span { color: var(--cut-bg); }
  #intro .hl-box .hit { outline: 0.06em solid currentColor; outline-offset: 0.04em; }
  #intro .hl-underline .hit { text-decoration: underline; text-decoration-thickness: 0.08em; text-underline-offset: 0.12em; }
  #intro .hl-glow .hit { color: #8fa0ff; text-shadow: 0 0 0.3em rgba(143, 160, 255, 0.8); }
  #intro .hl-blue .hit { color: #8fa0ff; }
  /* 光の点と名前は、マッチカットが終わるまで隠しておく */
  #intro .orb, #intro .halo, #intro .ripple, #intro .word { opacity: 0; }
  #intro .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body class="intro">
<div id="intro" aria-hidden="true">
  <div class="stage"></div>
  <div class="flash"></div>
  <div class="halo"></div>
  <div class="ripple"></div>
  <div class="orb"></div>
  <div class="word">one</div>
</div>

<main>
  <span class="mark" aria-hidden="true"></span>

  <form id="form" hidden>
    <label for="input">今日やることを、<br>1つだけ。</label>
    <div class="field">
      <input id="input" type="text" maxlength="80" autocomplete="off" enterkeyhint="done" placeholder="ひとつだけ書く" required>
      <button id="submitBtn" type="submit" aria-label="決める">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </button>
    </div>
  </form>

  <section id="view" hidden>
    <p class="eyebrow">今日の1つ</p>
    <h1 id="task"><span></span></h1>
    <div class="actions">
      <button id="doneBtn" type="button">やった</button>
      <p id="message">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="14" r="12" transform="rotate(-90 14 14)"/><path d="M9 14.5l3.4 3.4L19 11"/></svg>
        <span>今日はもう十分。</span>
      </p>
      <button id="editBtn" type="button">書き直す</button>
    </div>
  </section>
</main>

<script>
  const KEY = "hitotsu";
  const form = document.getElementById("form");
  const field = document.querySelector(".field");
  const input = document.getElementById("input");
  const view = document.getElementById("view");
  const task = document.querySelector("#task span");

  // 日付が変わったらリセットするため、ローカル日付をキーにする
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  }

  // iPhoneではlocalStorageが消えることがあるので、Cookie と IndexedDB にも同じ内容を書く
  const stores = {
    local: {
      get: () => localStorage.getItem(KEY),
      set: (v) => (v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY)),
    },
    cookie: {
      get: () => {
        const m = document.cookie.match(new RegExp(`(?:^|; )${KEY}=([^;]*)`));
        return m ? decodeURIComponent(m[1]) : null;
      },
      set: (v) => {
        document.cookie = v
          ? `${KEY}=${encodeURIComponent(v)}; max-age=${60 * 60 * 24 * 3}; path=/; SameSite=Lax`
          : `${KEY}=; max-age=0; path=/; SameSite=Lax`;
      },
    },
  };

  function idb(mode, fn) {
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open(KEY, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onerror = () => resolve(null);
        req.onsuccess = () => {
          const tx = req.result.transaction("kv", mode);
          const r = fn(tx.objectStore("kv"));
          tx.oncomplete = () => resolve(r && r.result);
          tx.onerror = () => resolve(null);
        };
      } catch (e) {
        resolve(null);
      }
    });
  }

  function parse(raw) {
    try {
      const data = JSON.parse(raw);
      if (data && data.date === today()) return data;
    } catch (e) {}
    return null;
  }

  async function load() {
    for (const s of Object.values(stores)) {
      let data = null;
      try { data = parse(s.get()); } catch (e) {}
      if (data) return data;
    }
    const timeout = new Promise((r) => setTimeout(() => r(null), 500));
    return parse(await Promise.race([idb("readonly", (os) => os.get(KEY)), timeout]));
  }

  function save(data) {
    const raw = data ? JSON.stringify(data) : null;
    for (const s of Object.values(stores)) {
      try { s.set(raw); } catch (e) {}
    }
    idb("readwrite", (os) => (raw ? os.put(raw, KEY) : os.delete(KEY)));
  }

  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  let state = null;

  function render() {
    if (!state) {
      view.hidden = true;
      form.hidden = false;
      input.value = "";
      field.classList.remove("has-text");
      if (!document.body.classList.contains("intro")) input.focus();
      return;
    }
    form.hidden = true;
    view.hidden = false;
    task.textContent = state.text;
    view.classList.toggle("done", state.done);
  }

  input.addEventListener("input", () => {
    field.classList.toggle("has-text", input.value.trim() !== "");
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    state = { date: today(), text, done: false };
    save(state);
    input.blur();
    render();
  });

  document.getElementById("doneBtn").addEventListener("click", () => {
    state.done = true;
    save(state);
    render();
  });

  document.getElementById("editBtn").addEventListener("click", () => {
    const prev = state.text;
    state = null;
    save(null);
    render();
    input.value = prev;
    field.classList.add("has-text");
    input.select();
  });

  // タブを開きっぱなしで日付をまたいだ場合に備える
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && state && state.date !== today()) {
      state = null;
      save(null);
      render();
    }
  });

  load().then((data) => {
    state = data;
    if (state) save(state);
    render();
    playIntro();
  });

  // ---- 起動アニメーション ----
  // 1) テキストのマッチカット（140BPMで加速） 2) 暗転の中に「one」と光の点 3) 点が見出しの上へ収まる
  // タップかキー入力で最後まで飛ばせる
  const CUT_STYLES = [
    { bg: "#f2f0ea", fg: "#141414", font: '"Instrument Serif", serif', size: 58, hl: "marker" },
    { bg: "#000000", fg: "#f5f5f7", font: '"Archivo Black", sans-serif', size: 44, hl: "invert", upper: true },
    { bg: "#8fa0ff", fg: "#05060a", font: '"Space Mono", monospace', size: 30, hl: "box" },
    { bg: "#ffffff", fg: "#111111", font: 'Georgia, "Times New Roman", serif', size: 42, weight: 700, hl: "underline" },
    { bg: "#0b0c10", fg: "#e9eaee", font: '"Bebas Neue", sans-serif', size: 104, hl: "glow", upper: true },
    { bg: "#e6e6e1", fg: "#1d1d1f", font: '"DM Serif Display", serif', size: 64, italic: true, hl: "marker" },
    { bg: "#000000", fg: "#ffffff", font: '"Archivo Black", sans-serif', size: 54, hl: "blue" },
    { bg: "#ffffff", fg: "#000000", font: '-apple-system, "Helvetica Neue", Arial, sans-serif', size: 38, weight: 700, hl: "invert" },
  ];

  const CUT_LINES = [
    "you don't need a longer list",
    "everything else can wait until tomorrow",
    "close the other tabs",
    "that is enough for today",
    "write it down before you start",
    "no notifications, no backlog",
    "small enough to finish today",
    "don't add anything else",
    "the rest is just noise",
    "start before you feel ready",
    "a single line on a blank page",
    "decide it, then do it",
    "focus is a decision",
    "stop planning and begin",
    "make today lighter",
    "the list can stay closed",
    "quiet morning, warm coffee",
    "leave the rest for tomorrow",
  ];

  const CUT_HITS = [
    ["just ", " thing."],
    ["do ", " thing today"],
    ["only ", ""],
    ["the ", " that matters"],
    ["today, just ", ""],
    ["pick ", " and let the rest go"],
    ["", " step at a time"],
    ["no. ", ""],
    ["just ", " more"],
    ["", " line, nothing else"],
    ["the only ", " you need"],
    ["", " day"],
  ];

  const BEAT = 60 / 140;
  const CUT_SECTIONS = [
    { n: 16, step: BEAT / 4 },
    { n: 16, step: BEAT / 6 },
    { n: 16, step: BEAT / 8 },
  ];

  function buildCut(stage, i, pick) {
    const st = CUT_STYLES[i % CUT_STYLES.length];
    const k = Math.min(1.1, Math.max(0.55, innerWidth / 900));
    const cut = document.createElement("div");
    cut.className = `cut hl-${st.hl}`;
    cut.style.background = st.bg;
    cut.style.color = st.fg;
    cut.style.setProperty("--cut-bg", st.bg);

    const page = document.createElement("div");
    page.className = "page";
    page.style.fontFamily = st.font;
    page.style.fontSize = `${Math.round(st.size * k)}px`;
    page.style.fontWeight = st.weight || 400;
    page.style.fontStyle = st.italic ? "italic" : "normal";
    page.style.textTransform = st.upper ? "uppercase" : "none";

    // 画面の上から下まで埋まる行数にし、各行の頭にも文を置いて左右も埋める
    const lh = Math.round(st.size * k) * 1.12;
    const half = Math.ceil(innerHeight / 2 / lh) + 1;
    const filler = () => pick(CUT_LINES) + "  " + pick(CUT_LINES) + "  " + pick(CUT_LINES) + "  ";
    let hitEl;
    for (let n = -half; n <= half; n++) {
      const p = document.createElement("p");
      if (n === 0) {
        const [pre, post] = pick(CUT_HITS);
        p.className = "hit-line";
        const a = document.createElement("span");
        a.className = "rest";
        a.textContent = filler() + pre;
        hitEl = document.createElement("span");
        hitEl.className = "hit";
        hitEl.innerHTML = "<span>one</span>";
        const b = document.createElement("span");
        b.className = "rest";
        b.textContent = post + "  " + filler();
        p.append(a, hitEl, b);
      } else {
        p.textContent = filler() + filler();
      }
      page.append(p);
    }
    cut.append(page);
    stage.append(cut);

    // 「one」の中心が画面の中心に来るように紙面ごとずらす
    const pr = page.getBoundingClientRect();
    const hr = hitEl.getBoundingClientRect();
    const x = innerWidth / 2 - (hr.left - pr.left + hr.width / 2);
    const y = innerHeight / 2 - (hr.top - pr.top + hr.height / 2);
    page.style.transform = `translate(${x}px, ${y}px)`;
    return cut;
  }

  async function playIntro() {
    const intro = document.getElementById("intro");
    const mark = document.querySelector(".mark");
    const finish = () => {
      intro.remove();
      document.body.classList.remove("intro");
      if (!form.hidden) input.focus();
    };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || !intro.animate) {
      finish();
      return;
    }

    // フォントが揃ってから紙面を組む（揃う前に測ると「one」の位置がずれる）
    try {
      await Promise.race([
        Promise.all(CUT_STYLES.map((st) => document.fonts.load(`${st.italic ? "italic " : ""}${st.weight || 400} 40px ${st.font}`, "one ONE"))),
        new Promise((r) => setTimeout(r, 1500)),
      ]);
    } catch (e) {}

    const $ = (s) => intro.querySelector(s);
    const stage = $(".stage");
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const pick = (arr) => arr[Math.floor(rand() * arr.length)];

    const cutTimes = [];
    let t = 0.15;
    for (const sec of CUT_SECTIONS) {
      for (let i = 0; i < sec.n; i++) {
        cutTimes.push({ t, fast: sec.step < BEAT / 4 });
        t += sec.step;
      }
    }
    const cutsEnd = t;
    const cuts = cutTimes.map((_, i) => buildCut(stage, i, pick));

    const ease = "cubic-bezier(0.2, 0.8, 0.2, 1)";
    const swift = "cubic-bezier(0.45, 0, 0.15, 1)";
    const anims = [];
    const play = (el, frames, opts) => {
      const a = el.animate(frames, { fill: "both", easing: ease, ...opts });
      anims.push(a);
      return a;
    };
    const ms = (sec) => Math.round(sec * 1000);

    // マッチカット中は、カメラがじわっと「one」へ寄っていく
    play(stage, [{ transform: "scale(1)" }, { transform: "scale(1.55)" }],
      { duration: ms(cutsEnd), easing: "cubic-bezier(0.5, 0, 0.9, 0.6)", fill: "forwards" });
    play(stage, [{ opacity: 1 }, { opacity: 0 }], { delay: ms(cutsEnd), duration: 1, fill: "forwards" });

    let skipped = false;
    const t0 = performance.now();
    let shown = null;
    let next = 0;
    const tick = () => {
      if (skipped || !intro.isConnected) return;
      const now = (performance.now() - t0) / 1000;
      while (next < cutTimes.length && cutTimes[next].t <= now) {
        if (shown) shown.classList.remove("on");
        shown = cuts[next];
        shown.classList.add("on");
        if (cutTimes[next].fast && next % 4 === 0) {
          $(".flash").animate([{ opacity: 0.5 }, { opacity: 0 }], { duration: 90 });
        }
        next++;
      }
      if (now < cutsEnd) requestAnimationFrame(tick);
      else if (shown) shown.classList.remove("on");
    };
    requestAnimationFrame(tick);

    // カットが止まり、暗転の中に光の点と「one」が現れる
    const T = ms(cutsEnd) + 200;
    play($(".orb"), [
      { transform: "scale(0.15)", opacity: 0, filter: "blur(14px)" },
      { transform: "scale(1.12)", opacity: 1, filter: "blur(0)", offset: 0.6 },
      { transform: "scale(1)", opacity: 1, filter: "blur(0)" },
    ], { delay: T, duration: 900 });
    play($(".halo"), [
      { transform: "scale(0.4)", opacity: 0 },
      { transform: "scale(1)", opacity: 1 },
    ], { delay: T, duration: 1200 });
    play($(".ripple"), [
      { transform: "scale(1)", opacity: 0.8 },
      { transform: "scale(6)", opacity: 0 },
    ], { delay: T + 150, duration: 1400, easing: "cubic-bezier(0.1, 0.6, 0.3, 1)", fill: "forwards" });
    play($(".word"), [
      { opacity: 0, filter: "blur(16px)", transform: "scale(1.08)" },
      { opacity: 1, filter: "blur(0)", transform: "scale(1)" },
    ], { delay: T + 100, duration: 1000 });

    // 暗転が明けて、点が見出しの上の定位置へ収まる
    const out = T + 1700;
    play($(".word"), [{ opacity: 1 }, { opacity: 0, filter: "blur(6px)" }],
      { delay: out, duration: 400, fill: "forwards" });
    play($(".halo"), [{ opacity: 1 }, { opacity: 0 }], { delay: out, duration: 500, fill: "forwards" });
    play(intro, [{ backgroundColor: getComputedStyle(intro).backgroundColor }, { backgroundColor: "transparent" }],
      { delay: out + 100, duration: 900, easing: swift, fill: "forwards" });

    // 大きさは描画中の値ではなくレイアウト上の値で測る（拡大アニメーション中の大きさを拾わないため）
    const orb = $(".orb");
    const orbRect = orb.getBoundingClientRect();
    const markRect = mark.getBoundingClientRect();
    const dx = markRect.left + markRect.width / 2 - (orbRect.left + orbRect.width / 2);
    const dy = markRect.top + markRect.height / 2 - (orbRect.top + orbRect.height / 2);
    const s = (markRect.width - 12) / orb.offsetWidth;
    const dot = getComputedStyle(mark, "::after").backgroundColor;
    const flyAt = out + 100, flyFor = 1300;
    const fly = play(orb, [
      { transform: "translate(0, 0) scale(1)", backgroundColor: getComputedStyle(orb).backgroundColor, boxShadow: getComputedStyle(orb).boxShadow },
      { transform: `translate(${dx}px, ${dy}px) scale(${s})`, backgroundColor: dot, boxShadow: "0 0 0 0 rgba(143, 160, 255, 0)" },
    ], { delay: flyAt, duration: flyFor, easing: swift, fill: "forwards" });
    // 着地の直前に、輪をまとったしるしへ重ねて切り替える
    play(mark, [{ opacity: 0, transform: "scale(0.6)" }, { opacity: 1, transform: "scale(1)" }],
      { delay: flyAt + flyFor - 350, duration: 500 });

    // 中身がふわりと立ち上がる
    const section = form.hidden ? view : form;
    [...section.children].forEach((el, i) => {
      play(el, [
        { opacity: 0, transform: "translateY(20px)", filter: "blur(8px)" },
        { opacity: 1, transform: "none", filter: "blur(0)" },
      ], { delay: out + 600 + i * 110, duration: 900 });
    });

    const skip = () => {
      skipped = true;
      stage.remove();
      anims.forEach((a) => a.finish());
    };
    intro.addEventListener("pointerdown", skip);
    addEventListener("keydown", skip);

    fly.finished.then(() => {
      removeEventListener("keydown", skip);
      finish();
      // 中身の表示が終わったらアニメーションの指定を外し、元のスタイルに戻す
      Promise.all(anims.map((a) => a.finished)).then(() => anims.forEach((a) => a.cancel()));
    });
  }
</script>
</body>
</html>
