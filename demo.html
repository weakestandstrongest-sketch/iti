<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>one Match Cut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A text match cut demo for the one app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* 画面の中心に「one」を固定し、その周りの紙面だけを拍に合わせて差し替える */
  :root {
    --bg: #000000;
    --fg: #f5f5f7;
    --muted: #86868b;
    --glow: #8fa0ff;
    --on-glow: #000000;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }

  /* 開始画面と最後の画面 */
  .screen {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 28px;
    text-align: center;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    z-index: 5;
    background: var(--bg);
  }
  .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0 7px, rgba(143, 160, 255, 0.2) 7.5px 13px, transparent 13.5px);
    box-shadow: 0 0 24px 4px rgba(143, 160, 255, 0.18);
  }
  .wordmark {
    font-size: clamp(72px, 22vw, 168px);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 0.9;
  }
  .sub { font-size: 15px; color: var(--muted); letter-spacing: 0.04em; }
  .row { display: flex; flex-wrap: wrap; gap: 12px 20px; justify-content: center; align-items: center; }

  button, .link {
    font: inherit;
    font-size: 17px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  button:active, .link:active { transform: scale(0.96); }
  button:focus-visible, .link:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
  .play {
    height: 50px;
    padding: 0 30px;
    border-radius: 999px;
    background: var(--glow);
    color: var(--on-glow);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .play svg { width: 14px; height: 14px; }
  .link { color: var(--glow); background: none; padding: 10px 4px; }

  /* 紙面は matchcut.js が組む */
  #stage { position: fixed; inset: 0; }

  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>

<section class="screen" id="start">
  <span class="dot" aria-hidden="true"></span>
  <h1 class="wordmark">one</h1>
  <p class="sub">A text match cut. 5 seconds, with sound.</p>
  <div class="row">
    <button class="play" id="playBtn" type="button">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1.2v11.6L12.5 7z" fill="currentColor"/></svg>
      Play
    </button>
    <button class="link" id="muteBtn" type="button">Play without sound</button>
  </div>
</section>

<section class="screen" id="end" hidden>
  <span class="dot" aria-hidden="true"></span>
  <h1 class="wordmark">one</h1>
  <p class="sub">Just one thing today.</p>
  <div class="row">
    <button class="play" id="againBtn" type="button">Replay</button>
    <a class="link" href="https://weakestandstrongest-sketch.github.io/iti/" target="_blank" rel="noopener">Open the app</a>
  </div>
</section>

<script src="matchcut.js"></script>
<script>
  const stage = document.getElementById("stage");
  const flash = document.getElementById("flash");

  // ---- タイムライン（140BPM。最初から1/4拍で切り、1/6拍、1/8拍へ加速する） ----
  const BEAT = 60 / 140;
  function timeline() {
    const ev = [{ t: 0, type: "intro" }, { t: 0, type: "kick", soft: true }];
    let t = BEAT;
    const sections = [
      { n: 16, step: BEAT / 4 },
      { n: 16, step: BEAT / 6 },
      { n: 16, step: BEAT / 8 },
    ];
    let cut = 0;
    let beat = 0;
    for (const sec of sections) {
      for (let i = 0; i < sec.n; i++) {
        ev.push({ t, type: "cut", i: cut++, fast: sec.step < BEAT / 4 });
        const onBeat = Math.abs((t - BEAT) / BEAT - Math.round((t - BEAT) / BEAT)) < 1e-3;
        if (onBeat) {
          ev.push({ t, type: "kick" });
          if (beat++ % 2 === 1) ev.push({ t, type: "snare" });
        }
        ev.push({ t, type: "hat" });
        t += sec.step;
      }
    }
    ev.push({ t, type: "black" });
    ev.push({ t: t + BEAT / 2, type: "end" }, { t: t + BEAT / 2, type: "boom" });
    return { ev: ev.sort((a, b) => a.t - b.t), zoomFrom: BEAT, zoomTo: t, total: cut };
  }

  // ---- 音（WebAudioで合成） ----
  let ac = null;
  function sound(type, at) {
    if (!ac) return;
    const g = ac.createGain();
    g.connect(ac.destination);
    if (type === "kick") {
      const o = ac.createOscillator();
      o.frequency.setValueAtTime(140, at);
      o.frequency.exponentialRampToValueAtTime(42, at + 0.14);
      g.gain.setValueAtTime(0.9, at);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.32);
      o.connect(g); o.start(at); o.stop(at + 0.34);
    } else if (type === "softkick") {
      const o = ac.createOscillator();
      o.frequency.setValueAtTime(90, at);
      o.frequency.exponentialRampToValueAtTime(40, at + 0.2);
      g.gain.setValueAtTime(0.35, at);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.4);
      o.connect(g); o.start(at); o.stop(at + 0.42);
    } else if (type === "hat" || type === "snare") {
      const len = type === "hat" ? 0.05 : 0.18;
      const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * len), ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource();
      src.buffer = buf;
      const f = ac.createBiquadFilter();
      f.type = type === "hat" ? "highpass" : "bandpass";
      f.frequency.value = type === "hat" ? 7000 : 1800;
      g.gain.setValueAtTime(type === "hat" ? 0.22 : 0.5, at);
      g.gain.exponentialRampToValueAtTime(0.001, at + len);
      src.connect(f); f.connect(g); src.start(at);
    } else if (type === "boom") {
      [55, 110, 164.8, 220, 329.6].forEach((hz, n) => {
        const o = ac.createOscillator();
        const og = ac.createGain();
        o.type = n === 0 ? "sine" : "triangle";
        o.frequency.value = hz;
        og.gain.setValueAtTime(0, at);
        og.gain.linearRampToValueAtTime(n === 0 ? 0.6 : 0.08, at + 0.02);
        og.gain.exponentialRampToValueAtTime(0.001, at + 3.2);
        o.connect(og); og.connect(ac.destination);
        o.start(at); o.stop(at + 3.3);
      });
    }
  }

  // ---- 再生 ----
  const startScreen = document.getElementById("start");
  const endScreen = document.getElementById("end");
  let cuts = [];
  let running = false;

  async function prepare() {
    await MatchCut.ready(2500);
    stage.style.transform = "";
    const tl = timeline();
    cuts = MatchCut.build(stage, tl.total);
    return tl;
  }

  async function play(withSound) {
    if (running) return;
    running = true;
    if (withSound) {
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        await ac.resume();
      } catch (e) { ac = null; }
    } else {
      ac = null;
    }
    const tl = await prepare();
    startScreen.hidden = true;
    endScreen.hidden = true;

    const t0 = ac ? ac.currentTime + 0.12 : 0;
    const p0 = performance.now() + 120;
    if (ac) for (const e of tl.ev) {
      if (e.type === "kick") sound(e.soft ? "softkick" : "kick", t0 + e.t);
      if (e.type === "hat" || e.type === "snare" || e.type === "boom") sound(e.type, t0 + e.t);
    }

    const visual = tl.ev.filter((e) => ["intro", "cut", "black", "end"].includes(e.type));
    let next = 0;
    let current = null;
    const now = () => (ac ? ac.currentTime - t0 : (performance.now() - p0) / 1000);

    const frame = () => {
      const t = now();
      while (next < visual.length && visual[next].t <= t) {
        const e = visual[next++];
        if (current) current.classList.remove("on");
        current = null;
        if (e.type === "cut") {
          current = cuts[e.i];
          current.classList.add("on");
          if (e.fast && e.i % 4 === 0) flash.animate([{ opacity: 0.5 }, { opacity: 0 }], { duration: 90 });
        } else if (e.type === "intro") {
          stage.style.background = "#000";
        } else if (e.type === "end") {
          endScreen.hidden = false;
          endScreen.animate([
            { opacity: 0, filter: "blur(16px)", transform: "scale(1.08)" },
            { opacity: 1, filter: "blur(0)", transform: "scale(1)" },
          ], { duration: 1100, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" });
          running = false;
          return;
        }
      }
      // 速くなる区間で、カメラがじわっと寄っていく
      const z = Math.min(1, Math.max(0, (t - tl.zoomFrom) / (tl.zoomTo - tl.zoomFrom)));
      stage.style.transform = `scale(${1 + 0.55 * z * z})`;
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  document.getElementById("playBtn").addEventListener("click", () => play(true));
  document.getElementById("muteBtn").addEventListener("click", () => play(false));
  document.getElementById("againBtn").addEventListener("click", () => play(!!ac));
</script>
</body>
</html>
